appId: net.jcode.jtype
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "^仅本地$|^Keep local$"
    commands:
      - tapOn: "^仅本地$|^Keep local$"
- runFlow:
    when:
      visible: "^关闭$|^Close$"
    commands:
      - tapOn: "^关闭$|^Close$"
- extendedWaitUntil:
    visible: ".*iOS provider 001.*"
    timeout: 30000
- assertVisible: "(?s).*Baseline content.*"
