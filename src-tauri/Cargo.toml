[package]
name = "jtype"
version = "0.1.0"
description = "JType"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jtype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jtype-core = { path = "../services/jtype-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tokio = { version = "1", features = ["time", "rt", "macros", "sync"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"

# The updater plugin only supports desktop targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# Android and iOS cannot link the host OpenSSL used by native-tls. Static
# WebPKI roots keep the same WebSocket API while making mobile cross-builds
# self-contained; desktop deliberately keeps its existing native-tls path.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tauri-plugin-mobile-import = { path = "../plugins/mobile-import" }
tauri-plugin-mobile-share = { path = "../plugins/mobile-share" }
tauri-plugin-secure-storage = { path = "../plugins/secure-storage" }
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
