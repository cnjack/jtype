services:
  mysql:
    image: mysql:8.4
    container_name: jtype-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jtype-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jtype}
      MYSQL_USER: ${MYSQL_USER:-jtype}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jtype-local}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: jtype-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-jtype}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-jtype-local-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["server", "/data", "--console-address", "0.0.0.0:9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  jtype-web:
    build:
      context: .
      dockerfile: services/jtype-web/Dockerfile
    container_name: jtype-web
    restart: unless-stopped
    environment:
      JTYPED_DATABASE_URL: mysql://jtype:${MYSQL_PASSWORD:-jtype-local}@mysql:3306/${MYSQL_DATABASE:-jtype}
      JTYPED_BIND_ADDR: 0.0.0.0:13345
      JTYPED_PUBLIC_BASE_URL: http://localhost:13345
      # Durable asset storage via the rustfs (S3-compatible) service. Without
      # these, the web service falls back to its own ephemeral container
      # filesystem and all uploaded images are lost on rebuild.
      JTYPED_STORAGE_ENDPOINT: http://rustfs:9000
      JTYPED_STORAGE_BUCKET: ${JTYPED_STORAGE_BUCKET:-jtype-content}
      JTYPED_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-jtype}
      JTYPED_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-jtype-local-secret}
      JTYPED_STORAGE_REGION: us-east-1
      # Outbound email (SMTP) for password reset + email verification. Left
      # blank by default; set JTYPED_SMTP_* (or configure in Admin → Email) to
      # enable. Disabled = these features return a clear error instead of mail.
      JTYPED_SMTP_HOST: ${JTYPED_SMTP_HOST:-}
      JTYPED_SMTP_PORT: ${JTYPED_SMTP_PORT:-587}
      JTYPED_SMTP_USERNAME: ${JTYPED_SMTP_USERNAME:-}
      JTYPED_SMTP_PASSWORD: ${JTYPED_SMTP_PASSWORD:-}
      JTYPED_SMTP_FROM: ${JTYPED_SMTP_FROM:-}
      JTYPED_SMTP_ENCRYPTION: ${JTYPED_SMTP_ENCRYPTION:-starttls}
    ports:
      - "13345:13345"
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started

volumes:
  mysql-data:
  rustfs-data:
