name: Build Desktop App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-desktop:
    name: Build ${{ matrix.name }} desktop app
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            artifact-name: jtype-windows-desktop
            artifact-path: src-tauri/target/release/bundle/nsis/*
          - name: macOS
            os: macos-latest
            bundle: dmg
            artifact-name: jtype-macos-desktop
            artifact-path: src-tauri/target/release/bundle/dmg/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ -n "${RELEASE_TAG}" ]]; then
            version="${RELEASE_TAG#v}"
            display_version="${version}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            display_version="${version}"
          else
            version="${package_version}"
            display_version="${package_version}+${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "display_version=${display_version}" >> "$GITHUB_OUTPUT"

      - name: Sync desktop package version
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';

          const version = process.env.APP_VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid app version: ${version}`);
          }

          function writeJsonVersion(path, updateLockRoot = false) {
            const data = JSON.parse(readFileSync(path, 'utf8'));
            data.version = version;
            if (updateLockRoot && data.packages?.['']) {
              data.packages[''].version = version;
            }
            writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          writeJsonVersion('package.json');
          if (existsSync('package-lock.json')) {
            writeJsonVersion('package-lock.json', true);
          }
          writeJsonVersion('src-tauri/tauri.conf.json');

          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = readFileSync(cargoPath, 'utf8');
          writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`));
          NODE

      # Build directly with the tauri CLI instead of tauri-action@v0, which
      # crashes on the runner with "unsettled top-level await" (a bundled-JS /
      # Node-version issue). The upload-artifact step below collects the bundle.
      - name: Build desktop app
        if: github.event_name != 'release'
        env:
          VITE_JTYPE_VERSION: ${{ steps.version.outputs.display_version }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundle }}

      - name: Build desktop app for release
        if: github.event_name == 'release'
        env:
          VITE_JTYPE_VERSION: ${{ steps.version.outputs.display_version }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundle }}

      - name: Upload desktop app to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.artifact-path }} --clobber

      - name: Upload desktop build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
