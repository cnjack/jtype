name: Build Desktop App

# Reusable: builds the macOS (.dmg) and Windows (.nsis) installers and uploads
# them to the release for the given tag. Invoked by release.yml; PR/main compile
# checks live in ci.yml (Linux, no installers). Can also be run manually against
# an existing tag via the Actions UI.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload the desktop installers to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload the desktop installers to
        required: true
        type: string

jobs:
  build-desktop:
    name: Build ${{ matrix.name }} desktop app
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: macOS
            os: macos-latest
            bundle: dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync desktop package version
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const version = process.env.APP_VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid app version: ${version}`);
          }

          function writeJsonVersion(path) {
            const data = JSON.parse(readFileSync(path, 'utf8'));
            data.version = version;
            writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          writeJsonVersion('package.json');
          writeJsonVersion('src-tauri/tauri.conf.json');

          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = readFileSync(cargoPath, 'utf8');
          writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`));
          NODE

      # Build directly with the tauri CLI instead of tauri-action@v0, which
      # crashes on the runner with "unsettled top-level await" (a bundled-JS /
      # Node-version issue).
      - name: Build desktop app
        env:
          VITE_JTYPE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundle }}

      - name: Upload desktop app to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ${{ matrix.artifact-path }} --clobber
