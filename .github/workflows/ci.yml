name: CI

# Fast pre-merge gate. Everything runs on Linux and is Rust-cached, so PRs get
# quick feedback. The slow, cross-platform desktop installers are built only by
# release.yml on a tag — not here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust services (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/jtype-core
            services/jtype-cli
            services/jtype-web

      - name: Test jtype-core
        run: cargo test --locked --manifest-path services/jtype-core/Cargo.toml

      - name: Test jtype-web
        run: cargo test --locked --manifest-path services/jtype-web/Cargo.toml

      - name: Build jtype-cli
        run: cargo build --locked --manifest-path services/jtype-cli/Cargo.toml

  app:
    name: Frontend + desktop compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            file

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Compile the desktop app (Rust + frontend) WITHOUT producing installers.
      # tauri build runs beforeBuildCommand ("npm run build" = tsc && vite
      # build), so this covers the frontend typecheck + build too. Catches build
      # breakage fast; the dmg/nsis bundles are a release-only concern.
      - name: Build frontend + desktop compile check
        run: pnpm exec tauri build --no-bundle
