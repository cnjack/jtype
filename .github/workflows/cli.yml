name: Build CLI

# Reusable: invoked by release.yml on a tag. Can also be run manually against an
# existing tag via the Actions UI.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload the CLI binaries to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload the CLI binaries to
        required: true
        type: string

jobs:
  build:
    name: Build jtype CLI (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: jtype-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: jtype-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: jtype-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: jtype-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/jtype-cli
          key: ${{ matrix.target }}

      # Stamp the crate version from the tag so `jtype --version` (which reads
      # CARGO_PKG_VERSION) reports the released version instead of whatever was
      # last committed to Cargo.toml.
      - name: Set CLI version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          export CLI_VERSION="${RELEASE_TAG#v}"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.CLI_VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid CLI version from tag: ${version}`);
          }
          const path = 'services/jtype-cli/Cargo.toml';
          const toml = readFileSync(path, 'utf8');
          writeFileSync(path, toml.replace(/^version = ".*"$/m, `version = "${version}"`));
          NODE

      # --locked is intentionally omitted: bumping the crate's own version above
      # would otherwise conflict with the committed Cargo.lock. Dependencies stay
      # pinned by Cargo.lock regardless.
      - name: Build
        run: cargo build --release --manifest-path services/jtype-cli/Cargo.toml --target ${{ matrix.target }}

      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp "services/jtype-cli/target/${{ matrix.target }}/release/jtype" "${{ matrix.asset }}"

      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "services/jtype-cli/target/${{ matrix.target }}/release/jtype.exe" "${{ matrix.asset }}"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber
