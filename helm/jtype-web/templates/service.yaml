apiVersion: v1
kind: Service
metadata:
  name: {{ include "jtype-web.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jtype-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 13345
      protocol: TCP
      name: http
  selector:
    {{- include "jtype-web.selectorLabels" . | nindent 4 }}
