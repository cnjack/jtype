[package]
name = "jtype-web"
version = "0.2.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
axum = "0.7"
hex = "0.4"
mime_guess = "2"
pulldown-cmark = "0.13"
rand_core = { version = "0.6", features = ["std"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = { version = "2", features = ["text"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = "0.5"
