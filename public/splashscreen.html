<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JType</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f8f6;
        color: #1c1917;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(232, 246, 242, 0.95), rgba(255, 255, 255, 0.88)),
          #f5f8f6;
      }

      main {
        width: 100%;
        padding: 36px;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border: 1px solid rgba(0, 136, 132, 0.16);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 20px 50px rgba(0, 111, 107, 0.14);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 24px;
        font-weight: 800;
        color: #006f6b;
      }

      h1 {
        margin: 18px 0 6px;
        font-size: 24px;
        line-height: 1.15;
        font-weight: 750;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #6f817a;
        font-size: 13px;
      }

      .loader {
        position: relative;
        width: 168px;
        height: 3px;
        margin: 26px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0, 136, 132, 0.14);
      }

      .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: #008884;
        animation: load 1.15s ease-in-out infinite;
      }

      @keyframes load {
        0% {
          transform: translateX(-120%);
        }
        55% {
          transform: translateX(95%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="JType is starting">
      <div class="brand">JT</div>
      <h1>JType</h1>
      <p>Opening your writing space</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
