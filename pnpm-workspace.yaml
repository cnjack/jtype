allowBuilds:
  # @scarf/scarf (pulled in by swagger-ui-dist) is analytics-only; never run its
  # postinstall script. Set explicitly so `pnpm install --frozen-lockfile` (CI)
  # doesn't fail with ERR_PNPM_IGNORED_BUILDS.
  '@scarf/scarf': false
  core-js: true
  esbuild: true
overrides:
  # vite 8 bundles with rolldown, not esbuild; the only remaining esbuild
  # consumer is @lingui/cli (config transpile). Force it past the dev-server
  # request vuln (GHSA-gv7w-rqvm-qjhr), patched only in 0.28.1.
  esbuild: ^0.28.1
