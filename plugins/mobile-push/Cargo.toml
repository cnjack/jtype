[package]
name = "tauri-plugin-mobile-push"
version = "0.1.0"
authors = ["JType"]
description = "JType APNs/FCM registration and canonical notification-route adapter"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-mobile-push"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
