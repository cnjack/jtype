[package]
name = "tauri-plugin-secure-storage"
version = "0.1.0"
authors = [ "JType" ]
description = "JType mobile Keychain and Android Keystore adapter"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-secure-storage"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
